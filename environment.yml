# Python environment for the geo-market pipeline.
#   conda env create -f environment.yml && conda activate geo-market
# R is NOT managed here: use the system R (>= 4.4, RStudio-compatible) and run
#   Rscript analysis/R/requirements.R
# once to install the R packages (arrow, data.table, fixest, plm, ...).
name: geo-market
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - numpy>=1.24
    - pandas>=2.0
    - pyarrow>=14
    - polars>=1.0
    - scipy>=1.10
    - scikit-learn>=1.2
    - statsmodels>=0.14
    - matplotlib>=3.7
    - geopandas==0.13.2
    - shapely>=2.0
    - geopy>=2.3
    - tqdm>=4.65
    - psutil
prefix: /opt/homebrew/Caskroom/miniforge/base/envs/geo-market
